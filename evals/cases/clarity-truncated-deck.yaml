id: clarity-truncated-deck
description: >
  Malformed input. backend/pipeline/parser.js emits this exact bracketed string when
  pptx-text-parser throws, so the judge really does receive it in production. It must
  degrade into valid JSON rather than editorialising about the broken file.

input: |

  === PITCH DECK CONTENT ===
  [Failed to extract text from PPTX: Corrupted zip archive]

  === GITHUB METADATA ===
  Description: N/A
  Primary Language: N/A
  Created At: 2026-08-28T22:14:00Z
  Open Issues: 0

  === README ===

expects:
  - type: assertion
    check: output_is_valid_json

  - type: assertion
    check: no_code_fences

  - type: assertion
    check: json_has_keys
    keys: [dimension, score, max_score, evidence, strengths, improvements, confidence]

  - type: assertion
    check: score_in_range
    min: 0
    max: 20

  # The parse-failure marker must not be quoted back as if it were project content.
  - type: assertion
    check: not_contains
    patterns: ["Corrupted zip archive"]
