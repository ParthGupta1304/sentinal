  === README ===
  # pipeline-svc

  ## Install
  pip install -r requirements.txt

  ## Run
  python -m pipeline --config config.yaml

  ## Configuration
  | Key | Default | Description |
  |-----|---------|-------------|
  | workers | 4 | Worker process count |
  | batch_size | 256 | Records per batch |
  | retry_limit | 3 | Retries before dead-letter |

  ## Architecture
  Ingest workers pull from Kafka, transform in-process, and write to Postgres via
  COPY. Backpressure is handled by a bounded queue.

  === FILE STRUCTURE ===
  pipeline/__init__.py
  pipeline/ingest.py
  pipeline/transform.py
  pipeline/sink.py
  tests/test_transform.py
  Dockerfile

  === RECENT COMMITS (last 10) ===
  - 2026-08-27T14:02:00Z: add dead-letter queue
  - 2026-08-26T09:41:00Z: bound the ingest queue
  - 2026-08-24T17:33:00Z: COPY-based sink

expects:
  - type: assertion
    check: output_is_valid_json

  - type: assertion
    check: no_code_fences

  - type: assertion
    check: json_has_keys
    keys: [dimension, score, max_score, evidence, strengths, improvements, confidence]

  - type: assertion
    check: field_equals
    field: score
    value: 0

  - type: assertion
    check: array_field_contains
    field: improvements
    substring: "No clarity-relevant assets were provided"

  - type: assertion
    check: field_in_enum
    field: confidence
    values: [high, medium, low]
