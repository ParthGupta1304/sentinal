id: clarity-flags-absent-problem
description: >
  A competent technical project whose documentation never says what problem it solves or
  who has that problem. There is plenty of content — architecture, configuration, commits
  — but none of it is clarity-relevant.

  Calibration rewrote this case. It originally carried two rubric criteria asking the judge
  to name the missing problem statement explicitly and still credit the documented
  architecture. Both scored 1/5 across every run, and the judge's reasoning showed why: the
  prompt promises that on insufficient information it returns score 0 with a fixed sentence,
  and that is exactly what it did. The criteria were asking it to violate its own contract.
  That is a bad case, not a discovered bug (§6.6 step 3).

  What survives is the genuinely interesting finding: a submission can be rich in content
  and still contain nothing this dimension can evaluate. That path is worth guarding, and
  it is assertable rather than a matter of judgement — so it costs no judge calls and
  carries a zero noise floor. It differs from clarity-empty-input by proving the fallback
  keys on relevance, not on length.

