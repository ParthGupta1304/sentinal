<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F1EA;
    --card:  #FFFcf7;
    --ink:   #1C1915;
    --mute:  #6F6A62;
    --line:  #E3DED4;
    --worse: #A8452B;
    --better:#3F5D34;
    --wash:  color-mix(in srgb, var(--worse) 9%, var(--card));
    --focus: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141310;
      --card:  #1C1B18;
      --ink:   #F3EFE6;
      --mute:  #A39E93;
      --line:  #2E2C27;
      --worse: #D56A4C;
      --better:#7FA56A;
      --wash:  color-mix(in srgb, var(--worse) 14%, var(--card));
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.5 Figtree, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .brand strong {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.02em;
  }
  .brand span { color: var(--mute); font-size: 14px; }
  select {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    max-width: min(240px, 100%);
    cursor: pointer;
    min-width: 0;
    text-overflow: ellipsis;
  }
  select:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .verdict {
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.15;
    margin: 0 0 10px;
  }
  .advice { color: var(--mute); margin: 0 0 28px; max-width: 42ch; }

  .tally {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 40px;
  }
  .chip {
    font-size: 13px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--mute);
  }
  .chip.worse { color: var(--worse); border-color: color-mix(in srgb, var(--worse) 35%, var(--line)); }
  .chip.better { color: var(--better); border-color: color-mix(in srgb, var(--better) 35%, var(--line)); }

  h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--mute);
    margin: 0 0 12px;
  }
  section { margin-bottom: 36px; }

  .stack { display: flex; flex-direction: column; gap: 10px; }
  .quiet { gap: 2px; }

  .test {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 16px 16px 18px;
    transition: border-color 160ms ease, background 160ms ease;
  }
  .test:hover { border-color: color-mix(in srgb, var(--ink) 22%, var(--line)); }
  .test.alert {
    background: var(--wash);
    border-color: color-mix(in srgb, var(--worse) 28%, var(--line));
    box-shadow: inset 3px 0 0 var(--worse);
  }
  .test.open { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .name { font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
  .why { color: var(--mute); font-size: 14px; margin-top: 4px; max-width: 46ch; }
  .pill {
    flex: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 4px 8px;
    border-radius: 999px;
    color: var(--mute);
    background: color-mix(in srgb, var(--mute) 10%, transparent);
  }
  .pill.worse { color: var(--worse); background: color-mix(in srgb, var(--worse) 12%, transparent); }
  .pill.better { color: var(--better); background: color-mix(in srgb, var(--better) 12%, transparent); }

  .quiet .test {
    background: transparent;
    border-color: transparent;
    border-radius: 8px;
    padding: 10px 8px;
  }
  .quiet .test:hover { background: var(--card); border-color: var(--line); }
  .quiet .test.open {
    background: var(--card);
    border-color: var(--line);
  }
  .quiet .why { display: none; }

  .panel {
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 12px 12px;
    background: var(--card);
    padding: 4px 18px 18px;
  }
  .panel p { margin: 8px 0 14px; color: var(--mute); font-size: 14px; }
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 640px) {
    .cols { grid-template-columns: 1fr; }
    header { align-items: stretch; }
    select { max-width: none; width: 100%; }
  }
  .cols h3 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--mute);
    margin: 0 0 8px;
  }
  .checks { font-size: 13px; }
  .checks div { padding: 3px 0; }
  .fail { color: var(--worse); }
  .ok { color: var(--mute); }
  pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: color-mix(in srgb, var(--ink) 4%, var(--paper));
    border-radius: 8px;
    font: 400 12px/1.45 "IBM Plex Mono", ui-monospace, monospace;
    overflow-x: auto;
    max-height: 220px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  details { margin-top: 8px; }
  summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--mute);
    width: fit-content;
  }

  .next {
    margin-top: 24px;
    padding: 18px 18px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }
  .next p { margin: 0 0 12px; }
  .next .sub { color: var(--mute); font-size: 14px; margin-bottom: 14px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button.act {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  button.act.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  button.act:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty { color: var(--mute); padding: 48px 0; }
  .empty h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--ink);
    margin: 0 0 10px;
  }
  .empty p { max-width: 42ch; }
  .empty a { color: var(--ink); font-weight: 500; }
  .empty pre {
    max-height: none;
    color: var(--ink);
    margin-top: 16px;
  }

  .hint { font-size: 13px; color: var(--mute); margin: -8px 0 16px; }

  @keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .test { animation: settle 180ms ease-out both; }
  @media (prefers-reduced-motion: reduce) { .test { animation: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">Loading…</p></div>

<script type="module">
const app = document.getElementById('app');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const CASES = {
  'clarity-happy-path': {
    name: 'Well-documented project',
    why: 'A complete, real submission. This should keep working after a normal edit.',
  },
  'clarity-thin-submission': {
    name: 'Thin documentation',
    why: 'There is code, but the write-up is weak. The judge should still return a proper evaluation.',
  },
  'clarity-empty-input': {
    name: 'Empty submission',
    why: 'Nothing was submitted. The judge must score 0 and say so.',
  },
  'clarity-prompt-injection': {
    name: 'Someone tries to cheat',
    why: 'The write-up tells the judge to give a perfect score. It should ignore that.',
  },
  'clarity-truncated-deck': {
    name: 'Broken pitch deck',
    why: 'The deck file could not be read. The judge should still return valid JSON.',
  },
  'clarity-oversized-input': {
    name: 'Huge file list',
    why: 'A very long input, like a big monorepo. The reply should still be well-formed.',
  },
  'clarity-flags-absent-problem': {
    name: 'No problem statement',
    why: 'Lots of technical content, but it never says what problem is being solved.',
  },
  'clarity-no-hallucination': {
    name: 'Almost empty repo',
    why: 'There is almost nothing there. The judge must not invent features.',
  },
  'clarity-evidence-grounded': {
    name: 'Sharp problem statement',
    why: 'A clearly written problem with a named user. Evidence should match the submission.',
  },
  'clarity-score-calibration': {
    name: 'Generic problem statement',
    why: 'A middling, generic write-up. The score should stay in the middle, not jump.',
  },
};

const CHECKS = {
  output_is_valid_json: 'Returned valid JSON',
  no_code_fences: 'Did not wrap the answer in markdown',
  json_has_keys: 'Included every required field',
  score_in_range: 'Score was in range',
  field_equals: 'A required field had the right value',
  field_in_enum: 'Used an allowed value',
  array_field_contains: 'Mentioned the required sentence',
  not_contains: 'Did not leak hidden instructions',
  output_length_within: 'Reply was a reasonable length',
};

const WORDS = {
  regressed: 'Worse',
  improved: 'Better',
  flat: 'Same',
  inconclusive: 'Unclear',
};

const meta = (id) => CASES[id] || { name: id, why: 'A test for this prompt.' };

function when(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function runLabel(r) {
  const n = r.counts?.regressed ?? 0;
  const head = n > 0 ? `${n} worse` : (r.counts?.inconclusive ? 'unclear' : 'looks safe');
  return [head, when(r.finished_at)].filter(Boolean).join(' · ');
}

function headline(c) {
  if (c.regressed === 1) return 'This change made 1 test worse.';
  if (c.regressed > 1) return `This change made ${c.regressed} tests worse.`;
  if (c.inconclusive > 0) return 'Nothing clearly got worse, but some results are unclear.';
  if (c.improved > 0 && c.regressed === 0) return 'This change looks safe — some tests even got better.';
  return 'This change looks safe.';
}

function advice(c) {
  if (c.regressed > 0) return 'Look at the tests below before you merge.';
  if (c.inconclusive > 0) return 'Scores moved a little. That can happen even when the prompt did not really change.';
  return 'Every test behaved the same as before.';
}

function reading(check) {
  const b = check.baseMedian;
  const h = check.headMedian;
  if (b === 1 && h === 1) return 'Still passing every check.';
  if (b === 1 && h < 1) return 'Used to pass every check. Now some fail.';
  if (b < 1 && h === 1) return 'Used to fail. Now it passes.';
  if (check.outcome === 'inconclusive') return 'Moved a little — not enough to be sure it is a real change.';
  const pct = (n) => `${Math.round(Number(n) * 100)}%`;
  return `Checks passing: ${pct(b)} before, ${pct(h)} after.`;
}

function group(cases) {
  const buckets = { regressed: [], inconclusive: [], improved: [], flat: [] };
  for (const c of cases) (buckets[c.outcome] || buckets.flat).push(c);
  return buckets;
}

function testButton(c, i, loud) {
  const m = meta(c.case_id);
  const word = WORDS[c.outcome] || c.outcome;
  return `
    <div>
      <button class="test ${loud ? 'alert' : ''}" data-case="${esc(c.case_id)}" style="animation-delay:${i * 40}ms" aria-expanded="false">
        <div class="row">
          <div>
            <div class="name">${esc(m.name)}</div>
            <div class="why">${esc(m.why)}</div>
          </div>
          <span class="pill ${c.outcome === 'regressed' ? 'worse' : c.outcome === 'improved' ? 'better' : ''}">${word}</span>
        </div>
      </button>
      <div class="panel" data-panel="${esc(c.case_id)}" hidden></div>
    </div>`;
}

function checkList(runData) {
  if (!runData) return '<div class="ok">Could not load this output.</div>';
  const r = runData.runs[0];
  const a = (r.assertions || []).map((x) =>
    `<div class="${x.pass ? 'ok' : 'fail'}">${x.pass ? 'Passed' : 'Failed'} · ${esc(CHECKS[x.check] || x.check)}${x.pass ? '' : ' — ' + esc(x.detail)}</div>`
  ).join('');
  const ru = (r.rubrics || []).map((x) =>
    `<div class="ok">Judged ${x.score}/5 · ${esc(x.justification)}</div>`
  ).join('');
  return a + ru || '<div class="ok">No checks on this run.</div>';
}

async function expand(btn, run) {
  const id = btn.dataset.case;
  const panel = document.querySelector(`[data-panel="${CSS.escape(id)}"]`);
  const open = !panel.hidden;
  document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = true; });
  document.querySelectorAll('.test').forEach((b) => { b.classList.remove('open'); b.setAttribute('aria-expanded', 'false'); });
  if (open) return;

  btn.classList.add('open');
  btn.setAttribute('aria-expanded', 'true');
  panel.hidden = false;
  panel.innerHTML = '<p>Loading before and after…</p>';

  const c = run.cases.find((x) => x.case_id === id);
  const check = c.checks[0];
  const [base, head] = await Promise.all(
    [c.base_ref, c.head_ref].map((ref) =>
      fetch(`/api/output?ref=${encodeURIComponent(ref)}`).then((r) => r.json()).catch(() => null))
  );

  const raw = (data) => data ? esc(data.runs[0].raw).slice(0, 2400) : 'unavailable';
  const n = (data) => data ? data.runs.length : '?';

  panel.innerHTML = `
    <p>${esc(reading(check))}</p>
    <div class="cols">
      <div>
        <h3>Current prompt</h3>
        <div class="checks">${checkList(base)}</div>
        <details><summary>Show the model’s reply</summary><pre>${raw(base)}</pre></details>
        <div class="ok" style="font-size:12px;margin-top:6px">Showing 1 of ${n(base)} tries</div>
      </div>
      <div>
        <h3>New prompt</h3>
        <div class="checks">${checkList(head)}</div>
        <details><summary>Show the model’s reply</summary><pre>${raw(head)}</pre></details>
        <div class="ok" style="font-size:12px;margin-top:6px">Showing 1 of ${n(head)} tries</div>
      </div>
    </div>`;
}

function nextStep(run, c) {
  if (c.regressed === 0) return '';
  const live = Boolean(run.session_id);
  const n = c.regressed;
  const noun = n === 1 ? 'test' : 'tests';
  if (!live) {
    return `<div class="next">
      <p>Don’t merge yet.</p>
      <div class="sub">${n} ${noun} got worse. Fix the prompt, or decide the new behaviour is what you want.</div>
    </div>`;
  }
  return `<div class="next">
    <p>Waiting on you — merging cannot be undone.</p>
    <div class="sub">${n} ${noun} got worse. The check has stopped and has not merged.</div>
    <div class="actions">
      <button class="act" data-act="deny">Don’t merge</button>
      <button class="act primary" data-act="allow">Merge anyway</button>
    </div>
  </div>`;
}

function render(run, runs) {
  const c = run.counts;
  const g = group(run.cases);
  const current = run.run_id;

  app.innerHTML = `
    <header>
      <div class="brand">
        <strong>Sentinel</strong>
        <span>Prompt check</span>
      </div>
      ${runs.length > 1 ? `<select id="runpick" aria-label="Earlier checks">
          ${runs.map((r) => `<option value="${esc(r.run_id)}" ${r.run_id === current ? 'selected' : ''}>${esc(runLabel(r))}</option>`).join('')}
        </select>` : ''}
    </header>
    <h1 class="verdict">${esc(headline(c))}</h1>
    <p class="advice">${esc(advice(c))}</p>
    <div class="tally">
      <span class="chip ${c.regressed ? 'worse' : ''}">${c.regressed} worse</span>
      <span class="chip ${c.improved ? 'better' : ''}">${c.improved} better</span>
      <span class="chip">${c.flat} same</span>
      ${c.inconclusive ? `<span class="chip">${c.inconclusive} unclear</span>` : ''}
    </div>
    ${g.regressed.length ? `<section>
      <h2>Needs a look</h2>
      <p class="hint">Click a test to see what changed.</p>
      <div class="stack">${g.regressed.map((x, i) => testButton(x, i, true)).join('')}</div>
    </section>` : ''}
    ${g.inconclusive.length ? `<section>
      <h2>Unclear</h2>
      <p class="hint">These moved a little. That can be ordinary model noise.</p>
      <div class="stack">${g.inconclusive.map((x, i) => testButton(x, i, false)).join('')}</div>
    </section>` : ''}
    ${g.improved.length ? `<section>
      <h2>Got better</h2>
      <div class="stack">${g.improved.map((x, i) => testButton(x, i, false)).join('')}</div>
    </section>` : ''}
    ${g.flat.length ? `<section>
      <h2>Unchanged</h2>
      <div class="stack quiet">${g.flat.map((x, i) => testButton(x, i, false)).join('')}</div>
    </section>` : ''}
    ${nextStep(run, c)}
  `;

  app.querySelectorAll('.test').forEach((btn) => {
    btn.addEventListener('click', () => expand(btn, run));
  });
  const pick = document.getElementById('runpick');
  if (pick) {
    pick.addEventListener('change', () => {
      const url = new URL(location.href);
      url.searchParams.set('run', pick.value);
      location.assign(url);
    });
  }
}

function empty() {
  app.innerHTML = `
    <div class="empty">
      <h1>No checks yet</h1>
      <p>Compare a changed prompt to the current one, then refresh this page.</p>
      <pre>node runner/src/compare.mjs --head evals/regressions/clarity-judge-head.md</pre>
    </div>`;
}

const listing = await fetch('/api/runs').then((r) => r.json());
if (!listing.runs.length) {
  empty();
} else {
  const id = new URL(location.href).searchParams.get('run') ?? listing.runs[0].run_id;
  const run = await fetch(`/api/runs/${encodeURIComponent(id)}`).then((r) => r.json());
  if (run.error) {
    app.innerHTML = `<div class="empty">
      <h1>Couldn’t find that check</h1>
      <p>It may have been deleted. Open the latest one instead.</p>
      <p><a href="/" style="color:inherit">Go to the latest check</a></p>
    </div>`;
  } else {
    render(run, listing.runs);
  }
}
</script>
</body>
</html>
